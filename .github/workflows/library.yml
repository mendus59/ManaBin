# Keeps the card library current. Every day it compares Scryfall's set list with the last build
# and rebuilds when a new set has been released (or the build is 30+ days old). The built files
# live on the `data` branch, not main, so card data never bloats the main history.
name: Card library

on:
  schedule:
    - cron: "30 9 * * *"  # daily at 09:30 UTC (1:30 AM Pacific)
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if nothing changed"
        type: boolean
        default: false

concurrency:
  group: library
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      rebuild: ${{ steps.check.outputs.rebuild }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Get the last build's manifest
        run: |
          git fetch --depth 1 origin data 2>/dev/null && git show origin/data:manifest.json > "$RUNNER_TEMP/manifest.json" || echo "No library build yet"
      - id: check
        run: python tools/check_sets.py --manifest "$RUNNER_TEMP/manifest.json" ${{ inputs.force && '--force' || '' }}

  build:
    needs: check
    if: needs.check.outputs.rebuild == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_library.py --out "$RUNNER_TEMP/library"
      - name: Publish to the data branch
        working-directory: ${{ runner.temp }}/library
        env:
          TOKEN: ${{ github.token }}
        run: |
          # One commit, force-pushed, so old card data doesn't pile up in the repo.
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Card library $(date -u +%Y-%m-%d)"
          git push -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" data

  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
